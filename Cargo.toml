[package]
name = "jxl-loader"
version = "0.4.0"
# tombi: lint.rules.deprecated.disabled = true
authors = ["frabera"]
edition = "2024"
description = "JXL decoder for Typst."
readme = "README.md"
repository = "https://github.com/frabera/jxltypst"
license = "MIT"
categories = ["JPEG XL", "image", "jxl", "plugin", "typst", "wasm"]

[lib]
crate-type = ["cdylib"]

[dependencies]
jxl = { git = "https://github.com/libjxl/jxl-rs", rev = "13b0b655bef624328c6c2d84b5b2a360341d4a5e", version = "0.7.4", default-features = false, features = ["simd128"] }
wasm-minimal-protocol = "0.2.1"

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
