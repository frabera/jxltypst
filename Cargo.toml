[package]
name = "jxl-loader"
version = "0.5.1"
authors = ["frabera"]  # tombi: lint.rules.deprecated.disabled = true
edition = "2024"
description = "JXL decoder for Typst."
readme = "README.md"
repository = "https://github.com/frabera/jxltypst"
license = "MIT"
categories = ["JPEG XL", "image", "jxl", "plugin", "typst", "wasm"]

[lib]
crate-type = ["cdylib"]

[dependencies]
jxl = { git = "https://github.com/libjxl/jxl-rs", rev = "5ffd92501f5cd20d4cf9ea730b823b3cf5cbc15c", version = "0.8.0", default-features = false, features = ["simd128"] }
wasm-minimal-protocol = "0.2.1"

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
