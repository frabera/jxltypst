[package]
name = "jxl-loader"
version = "0.5.1"
authors = ["frabera"]  # tombi: lint.rules.deprecated.disabled = true
edition = "2024"
description = "JXL decoder for Typst."
readme = "README.md"
repository = "https://github.com/frabera/jxltypst"
license = "MIT"
categories = ["JPEG XL", "image", "jxl", "plugin", "typst", "wasm"]

[lib]
crate-type = ["cdylib"]

[dependencies]
jxl = { git = "https://github.com/libjxl/jxl-rs", rev = "19280a9c7a0f5779652b615ab60aeed85bb9b2ca", version = "0.8.0", default-features = false, features = ["simd128"] }
wasm-minimal-protocol = "0.2.1"

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
